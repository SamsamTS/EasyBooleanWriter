<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Easy Boolean Writer</title>
<style type="text/css">
:root {
  color-scheme: light;
  --bg: #f3f5f8;
  --panel: #ffffff;
  --fg: #1b1f24;
  --muted: #667085;
  --border: #d0d7de;
  --accent: #2f6feb;
  --btn: #eef1f5;
  --btn-hover: #e2e7ee;
  --err: #c62828;
  --err-bg: rgba(198, 40, 40, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg: #12151a;
    --panel: #1b2027;
    --fg: #e6e9ee;
    --muted: #9aa4b2;
    --border: #343c47;
    --accent: #6ea0ff;
    --btn: #262d37;
    --btn-hover: #323b47;
    --err: #ff8a80;
    --err-bg: rgba(255, 138, 128, 0.16);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151a;
  --panel: #1b2027;
  --fg: #e6e9ee;
  --muted: #9aa4b2;
  --border: #343c47;
  --accent: #6ea0ff;
  --btn: #262d37;
  --btn-hover: #323b47;
  --err: #ff8a80;
  --err-bg: rgba(255, 138, 128, 0.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
}
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 64px 16px 40px 16px;
}
h1 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 16px 0;
}
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 6px;
}
.row { display: flex; gap: 8px; }
#expr {
  flex: 1 1 auto;
  min-width: 0;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 1.1rem;
  padding: 10px 12px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
}
#expr:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
button {
  font: inherit;
  color: var(--fg);
  background: var(--btn);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: var(--btn-hover); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#clearBtn { padding: 0 16px; }
.hint {
  margin: 10px 0 0 0;
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.5;
}
.hint code { font-family: ui-monospace, Menlo, Consolas, monospace; }
.hint .ex-arrow { margin: 0 0.4em; }
.hint .ex-result {
  font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "STIXGeneral", Cambria, "Times New Roman", serif;
  font-size: 1.15em;
  line-height: 2;
  color: inherit;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
}
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme-toggle { position: fixed; top: 12px; right: 12px; z-index: 10; }
.lang-toggle { right: 56px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; }
#outputPanel { min-height: 120px; }
#result {
  font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "STIXGeneral", Cambria, "Times New Roman", serif;
  font-size: 2rem;
  line-height: 2.2;
  min-height: 2.2em;
  padding-top: 4px;
  overflow-wrap: anywhere;
  text-align: center;
}
.ov {
  display: inline-block;
  border-top: 0.07em solid currentColor;
  padding-top: 0.05em;
  margin: 0 0.07em;
  line-height: 1.1;
}
.ov > .ov:first-child { margin-left: 0; }
.ov > .ov:last-child { margin-right: 0; }
.err {
  background: var(--err-bg);
  border-bottom: 1px dotted var(--err);
  border-radius: 2px;
}
.err.ghost { color: var(--err); opacity: 0.7; }
#note {
  text-align: center;
  min-height: 1.2em;
  margin-top: 6px;
  font-size: 0.78rem;
  color: var(--muted);
}
sub { font-size: 0.65em; line-height: 0; }
</style>
</head>
<body>
<button id="langToggle" class="icon-btn theme-toggle lang-toggle" type="button">EN</button>
<button id="themeToggle" class="icon-btn theme-toggle" type="button" title="Toggle light / dark theme" aria-label="Toggle light / dark theme">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3 a9 9 0 0 1 0 18 z" fill="currentColor"></path></svg>
</button>
<main>
  <h1 id="title">Easy Boolean Writer</h1>
  <div id="inputPanel" class="panel">
    <label for="expr">Expression</label>
    <div class="row">
      <input id="expr" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="e.g. /(/A + B) . C + /D" />
      <button id="clearBtn" type="button">Clear</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div id="outputPanel" class="panel">
    <div id="result" aria-live="polite"></div>
    <div id="note"></div>
  </div>
</main>
<script type="text/javascript">
//<![CDATA[

    'a': '\u2090', 'e': '\u2091', 'o': '\u2092', 'x': '\u2093', 'h': '\u2095',

      langTip: 'Passer en fran\u00E7ais',

        open: function () { return 'Unbalanced parenthesis: missing )'; },
        close: function () { return 'Unbalanced parenthesis: unexpected )'; },

      exLabel: 'Exemple\u00A0:',

      langTip: 'Switch to English',
